services:
  mongo:
    image: mongo:7
    container_name: foodexpress-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: ..
      dockerfile: infrastructure/backend.Dockerfile
    container_name: foodexpress-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/foodexpress
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ..
      dockerfile: infrastructure/frontend.Dockerfile
    container_name: foodexpress-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongo_data: